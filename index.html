<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#d81b60">
<title>Franca Alfajoría · Haz tu pedido</title>
<meta name="description" content="Alfajores artesanales clásicos y premium. Haz tu pedido y te confirmamos por WhatsApp.">
<style>
/* ====== CONFIGURACIÓN: número de WhatsApp con código de país, sin + ni espacios ====== */
</style>
<script>
const WHATSAPP = '56977825685';   // <-- CAMBIAR por el número de ella, ej: 56912345678
</script>
<style>
:root{--rosa:#d81b60;--rosa2:#ad1457;--fondo:#fff0f6;--soft:#ffe0ee;--line:#f8c8dc;--txt:#4a1030;--sub:#a0607e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--fondo);color:var(--txt);font-family:system-ui,-apple-system,Roboto,sans-serif}
.hero{background:linear-gradient(160deg,#ec407a,#ad1457);color:#fff;text-align:center;padding:28px 16px 34px;border-radius:0 0 28px 28px}
.hero h1{margin:0;font-family:'Brush Script MT','Segoe Script',cursive;font-weight:400;font-size:42px}
.hero p{margin:6px 0 0;color:#ffe0ee}
main{max-width:560px;margin:0 auto;padding:14px 14px 150px}
h2{color:var(--rosa2);font-size:18px;margin:20px 4px 4px}
.nota{font-size:13px;color:var(--sub);margin:0 4px 8px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:4px 14px}
.it{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px dashed var(--line)}
.it:last-child{border-bottom:0}
.it .n{flex:1}.it .n b{display:block;font-size:15px}.it .n span{color:var(--rosa);font-weight:700}
.it .n small{display:block;color:var(--sub);font-size:12px}
.q{display:flex;align-items:center;gap:8px}
.q button{width:36px;height:36px;border-radius:50%;border:0;background:var(--soft);color:var(--rosa);font-size:20px}
.q button.mas{background:var(--rosa);color:#fff}
.q span{min-width:18px;text-align:center;font-weight:800}
label{display:block;font-size:13px;color:var(--sub);margin:12px 0 4px}
input,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;font-size:16px;font-family:inherit;background:#fff;color:var(--txt)}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:12px;border-radius:24px;border:1px solid var(--line);background:#fff;color:var(--rosa2);font-size:15px;font-weight:600}
.seg button.on{background:var(--rosa);border-color:var(--rosa);color:#fff}
.form{background:#fff;border:1px solid var(--line);border-radius:18px;padding:6px 14px 14px}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid var(--line);padding:12px 14px 14px;box-shadow:0 -4px 14px #ad145722}
.bar .in{max-width:560px;margin:0 auto}
.tot{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.tot b{font-size:26px;color:var(--rosa)}
.wa{width:100%;border:0;border-radius:28px;padding:16px;font-size:17px;font-weight:800;color:#fff;background:#25d366;display:flex;align-items:center;justify-content:center;gap:8px}
.wa:disabled{background:#c9c9c9}
.err{color:#b42318;font-size:13px;min-height:16px;text-align:center;margin-top:6px}
.hidden{display:none}
footer{text-align:center;color:var(--sub);font-size:12px;margin-top:20px}
</style>
</head>
<body>
<div class="hero">
  <h1>🎀 Franca Alfajoría</h1>
  <p>Alfajores artesanales hechos con amor 💖</p>
</div>

<main>
  <div id="catalogo"></div>

  <h2>✨ Tus datos</h2>
  <div class="form">
    <label>Tu nombre</label><input id="nombre" autocomplete="name" placeholder="Ej: Camila">
    <label>¿Cómo lo quieres?</label>
    <div class="seg" id="entrega"><button data-e="Retiro" class="on">🛍️ Retiro</button><button data-e="Despacho">🛵 Despacho</button></div>
    <div id="dirBox" class="hidden"><label>Dirección</label><input id="dir" autocomplete="street-address" placeholder="Calle, número, comuna"></div>
    <div style="display:flex;gap:8px">
      <div style="flex:1"><label>¿Para qué día?</label><input id="fecha" type="date"></div>
      <div style="flex:1"><label>Hora aprox.</label><input id="hora" type="time"></div>
    </div>
    <label>Sabores o comentarios</label>
    <textarea id="coment" rows="3" placeholder="Ej: clásicos en chocolate blanco, caja premium con 2 frambuesa y 2 Bon o Bon 💕"></textarea>
  </div>
  <footer>Tu pedido se envía por WhatsApp y te confirmamos disponibilidad y pago por ahí 💌</footer>
</main>

<div class="bar"><div class="in">
  <div class="tot"><span id="resumen">Elige tus alfajores 👆</span><b id="total">$0</b></div>
  <button class="wa" id="enviar" disabled>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3c-.2.3-1 1-1 2.3s1 2.7 1.2 2.9c.1.2 2 3.1 4.9 4.3 1.8.8 2.5.8 3.4.7.6-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.1-1.2l-.5-.2z"/></svg>
    Enviar pedido por WhatsApp
  </button>
  <div class="err" id="err"></div>
</div></div>

<script>
const CATALOGO = [
  {t:'🍫 Alfajores Clásicos', nota:'Bañados en chocolate negro o blanco. Cuéntanos en los comentarios cuál deseas.', items:[
    ['c1','Clásico individual',800],['c3b','Clásico bolsita de 3',2200],['c3c','Clásico caja de 3',2700],
    ['c4','Clásico caja de 4',3200],['c6','Clásico caja de 6',4800]]},
  {t:'🍓 Alfajores Premium', nota:'Frambuesa, Prestigio o Bon o Bon. Cuéntanos en los comentarios cuáles deseas.', items:[
    ['p1','Premium individual',1000],['p3b','Premium bolsita de 3',2700],['p3c','Premium caja de 3',3300],['p4','Premium caja de 4',4200]]},
  {t:'🎁 Caja Surtida', nota:'3 clásicos + 3 premium. Cuéntanos en los comentarios cuáles deseas.', items:[['s6','Caja surtida de 6',5500]]},
];
const $=s=>document.querySelector(s);
const fmt=n=>'$'+n.toLocaleString('es-CL');
const P={}; CATALOGO.forEach(c=>c.items.forEach(([id,n,p,sub])=>P[id]={n,p,sub}));
const cant={}; let entrega='Retiro';

$('#catalogo').innerHTML=CATALOGO.map(c=>`<h2>${c.t}</h2>${c.nota?`<p class="nota">${c.nota}</p>`:''}
  <div class="card">${c.items.map(([id,n,p,sub])=>`<div class="it"><div class="n"><b>${n}</b>${sub?`<small>${sub}</small>`:''}<span>${fmt(p)}</span></div>
  <div class="q"><button data-m="${id}" aria-label="Quitar">−</button><span id="q-${id}">0</span><button class="mas" data-p="${id}" aria-label="Agregar">+</button></div></div>`).join('')}</div>`).join('');

function actualizar(){
  let tot=0,u=0; for(const id in cant){tot+=cant[id]*P[id].p;u+=cant[id];}
  Object.keys(P).forEach(id=>$('#q-'+id).textContent=cant[id]||0);
  $('#total').textContent=fmt(tot);
  $('#resumen').textContent=u?`${u} producto${u>1?'s':''}`:'Elige tus alfajores 👆';
  $('#enviar').disabled=!u; $('#err').textContent='';
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-p],[data-m]'); if(!b) return;
  if(b.dataset.p) cant[b.dataset.p]=(cant[b.dataset.p]||0)+1;
  else { const k=b.dataset.m; if(cant[k]) cant[k]--; if(!cant[k]) delete cant[k]; }
  actualizar();
});
$('#entrega').onclick=e=>{const b=e.target.closest('button'); if(!b) return; entrega=b.dataset.e;
  document.querySelectorAll('#entrega button').forEach(x=>x.classList.toggle('on',x===b));
  $('#dirBox').classList.toggle('hidden',entrega!=='Despacho');};
const hoy=new Date(); $('#fecha').min=hoy.toISOString().slice(0,10);

$('#enviar').onclick=()=>{
  const nombre=$('#nombre').value.trim(), fecha=$('#fecha').value, dir=$('#dir').value.trim();
  if(!nombre) return err('Escribe tu nombre 💕','#nombre');
  if(!fecha) return err('Elige para qué día lo quieres','#fecha');
  if(entrega==='Despacho'&&!dir) return err('Escribe la dirección de despacho','#dir');
  let tot=0; const lineas=Object.keys(cant).map(id=>{const s=cant[id]*P[id].p; tot+=s; return `• ${cant[id]} × ${P[id].n} — ${fmt(s)}`;});
  const f=new Date(fecha+'T12:00').toLocaleDateString('es-CL',{weekday:'long',day:'numeric',month:'long'});
  const msg=[
    '🎀 *Nuevo pedido – Franca Alfajoría*','',
    `👤 *Nombre:* ${nombre}`,'',
    '🧁 *Pedido:*',...lineas,'',
    `💰 *Total: ${fmt(tot)}*`+(entrega==='Despacho'?' (+ despacho por confirmar)':''),'',
    `🚚 *Entrega:* ${entrega}`+(entrega==='Despacho'?`\n📍 *Dirección:* ${dir}`:''),
    `📅 *Para:* ${f} (${fecha.split('-').reverse().join('-')})`+($('#hora').value?` a las ${$('#hora').value}`:''),
    $('#coment').value.trim()?`\n📝 *Comentarios:* ${$('#coment').value.trim()}`:''
  ].join('\n').trim();
  window.location.href='https://wa.me/'+WHATSAPP+'?text='+encodeURIComponent(msg);
};
function err(t,sel){$('#err').textContent=t; if(sel){$(sel).focus();}}
actualizar();
</script>
</body>
</html>
