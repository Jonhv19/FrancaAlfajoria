name: Generar APK
on:
  push:
    paths-ignore:
      - '**.html'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        run: |
          curl -L -o p.zip "https://drive.usercontent.google.com/download?id=1wZBDUK7MlGFghJwdrEHGLK2oiEAtOA1R&export=download&confirm=t"
          unzip -o -q p.zip
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap sync android
      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Franca-Alfajoria.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Franca Alfajoria v1.0.${{ github.run_number }}
          files: Franca-Alfajoria.apk
